<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Code Analyse</title>
    <script src="code.js"></script>
    <script src="instr.js"></script>
    <script src="diagram.js"></script>
    <script src="digitMask.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: monospace;
        font-size: 12px;
        background: #1e1e1e;
        color: #ccc;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* --- LED-Leiste --- */
      #led-bar {
        background: #111;
        border-bottom: 1px solid #333;
        padding: 6px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #led-bar span.led-label {
        color: #888;
        margin-right: 4px;
        font-size: 11px;
      }
      .led {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #333;
        border: 1px solid #555;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: #666;
        transition: background 0.2s, color 0.2s;
      }
      .led.active {
        background: #cc0000;
        border-color: #ff4444;
        color: #fff;
        box-shadow: 0 0 6px #cc0000;
      }

      /* --- Mask-Tabelle --- */
      #mask-panel {
        background: #161622;
        border-bottom: 2px solid #333;
        overflow-x: auto;
        overflow-y: auto;
        max-height: 160px;
        flex-shrink: 0;
      }
      #mask-panel table {
        border-collapse: collapse;
        white-space: nowrap;
        font-size: 11px;
      }
      #mask-panel th {
        background: #1e1e30;
        color: #888;
        padding: 3px 6px;
        border: 1px solid #333;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      #mask-panel td {
        padding: 2px 6px;
        border: 1px solid #2a2a2a;
      }
      #mask-panel tr.instr-row td          { background: #1a1a2e; color: #ccc; }
      #mask-panel tr.instr-row.kein-msk td { background: #222;    color: #555; }
      #mask-panel td.s-aktiv  { color: #4ec94e; font-weight: bold; }
      #mask-panel td.s-leer   { color: #2a2a2a; }
      #mask-panel td.col-instrno { color: #9cdcfe; text-align: right; }
      #mask-panel td.col-msk     { color: #ce9178; text-align: center; }
      #mask-panel td.col-name    { color: #4ec9b0; max-width: 200px;
                                   overflow: hidden; text-overflow: ellipsis; }

      /* --- Hauptbereich --- */
      #main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* --- Code-Listing --- */
      #code-panel {
        width: 420px;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        border-right: 2px solid #333;
      }
      #code-header {
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 4px 8px;
        color: #aaa;
        font-size: 11px;
        display: grid;
        grid-template-columns: 50px 40px 40px 100px 1fr;
        gap: 4px;
      }
      #code-list {
        overflow-y: auto;
        flex: 1;
      }
      .code-row {
        display: grid;
        grid-template-columns: 50px 40px 40px 100px 1fr;
        gap: 4px;
        padding: 2px 8px;
        cursor: pointer;
        border-bottom: 1px solid #2a2a2a;
        line-height: 1.5;
      }
      .code-row:hover        { background: #2a2a2a; }
      .code-row.selected     { background: #1a3a5c; color: #fff; }
      .code-row .col-bits    { color: #569cd6; letter-spacing: 1px; }
      .code-row .col-addr    { color: #9cdcfe; }
      .code-row .col-label   { color: #4ec9b0; }
      .code-row .col-reass   { color: #ce9178; }

      /* --- Bit-Editor --- */
      .bit-cell {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
        font-size: 10px;
        cursor: pointer;
        border: 1px solid #444;
        user-select: none;
      }
      .bit-cell.bit-label {
        color: #666;
        font-size: 9px;
        cursor: default;
        border: none;
        background: transparent;
        height: auto;
      }
      .bit-cell[data-val="1"] { background: #1a4a1a; color: #4ec94e; border-color: #4ec94e; }
      .bit-cell[data-val="0"] { background: #2a2a2a; color: #888;    border-color: #444;    }

      /* --- Diagramm --- */
      @keyframes blinken {
        0%, 100% { opacity: 1;   }
        50%       { opacity: 0.2; }
      }
      #container [fill="#cc0000"]   { animation: blinken 1s infinite; }
      #container [stroke="#cc0000"] { animation: blinken 1s infinite; }

      #diagram-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #diagram-info {
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 4px 10px;
        color: #888;
        font-size: 11px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      #diagram-info #current-info { color: #4ec9b0; }
      #container {
        flex: 1;
        overflow: auto;
        background: #fff;
      }
      #container > div {
        width: 1169px;
        height: 1654px;
      }
    </style>
  </head>
  <body>

    <!-- LED-Leiste: InstrNo 11–74 -->
    <div id="led-bar">
      <span class="led-label">InstrNo:</span>
    </div>

    <!-- Mask-Tabelle -->
    <div id="mask-panel">
      <table id="mask-table">
        <thead>
          <tr>
            <th>InstrNo</th>
            <th>InstrName</th>
            <th>Msk</th>
            <th>S7</th><th>S11</th><th>S5</th><th>S10</th><th>S13</th><th>S6</th><th>S3</th>
            <th>S9</th><th>S4</th><th>S2</th><th>S1</th><th>S8</th><th>S12</th><th>S14</th>
          </tr>
        </thead>
        <tbody id="mask-tbody"></tbody>
      </table>
    </div>

    <div id="main">

      <!-- Code-Listing links -->
      <div id="code-panel">
        <div id="code-header">
          <span>Label</span>
          <span>Addr</span>
          <span>Line</span>
          <span>Bits</span>
          <span>Reass</span>
        </div>

        <!-- Bit-Editoren: erscheinen nach erstem Zeilenklick -->
        <div id="bit-editor" style="background:#1a1a2e; border-bottom:1px solid #333;
                                    padding:4px 8px; display:none;">
          <div style="color:#888; font-size:10px; margin-bottom:3px;">Bits bearbeiten:</div>
          <div id="bit-cells" style="display:flex; gap:3px;"></div>
          <div style="display:flex; gap:16px; margin-top:4px;">
            <div>
              <div style="color:#888; font-size:10px; margin-bottom:3px;">src: (D7 D6 D1 D0)</div>
              <div id="bit-cells-src" style="display:flex; gap:3px;"></div>
            </div>
            <div>
              <div style="color:#888; font-size:10px; margin-bottom:3px;">dest: (D10 D9 D8)</div>
              <div id="bit-cells-dest" style="display:flex; gap:3px;"></div>
            </div>
          </div>
        </div>

        <div id="code-list"></div>
      </div>

      <!-- Diagramm rechts -->
      <div id="diagram-panel">
        <div id="diagram-info">
          <span>Klick auf Zeile → Decode</span>
          <span id="current-info"></span>
        </div>
        <div id="container"></div>
      </div>

    </div>

    <script>
      window.mxBasePath = "https://cdn.jsdelivr.net/npm/mxgraph@4.2.2/javascript/src"
      window.mxLoadStylesheets = false
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mxgraph@4.2.2/javascript/mxClient.min.js"></script>

    <script>

      // ═══════════════════════════════════════════════════════════════
      // KONSTANTEN
      // ═══════════════════════════════════════════════════════════════

      const INSTR_MIN   = 11
      const INSTR_MAX   = 74

      const BIT_COLS    = ["D12","D11","D10","D9","D8","D7","D6","D5","D4","D3","D2","D1","D0"]
      const SRC_COLS    = ["D7","D6","D1","D0"]
      const DEST_COLS   = ["D10","D9","D8"]
      const S_SPALTEN   = ["S7","S11","S5","S10","S13","S6","S3","S9","S4","S2","S1","S8","S12","S14"]
      const MSK_SPALTEN = ["Msk0","Msk1","Msk2","Msk3","Msk4","Msk5"]   // Msk6 ignorieren

      const FARBE_AKTIV   = "#cc0000"
      const FARBE_INAKTIV = "#000000"


      // ═══════════════════════════════════════════════════════════════
      // LED-LEISTE aufbauen
      // ═══════════════════════════════════════════════════════════════

      const ledBar = document.getElementById("led-bar")
      const leds = {}

      for (let nr = INSTR_MIN; nr <= INSTR_MAX; nr++) {
        const led = document.createElement("div")
        led.className = "led"
        led.textContent = nr
        led.title = "InstrNo " + nr
        ledBar.appendChild(led)
        leds[nr] = led
      }

      function ledsAktualisieren(aktiveNummern) {
        for (let nr = INSTR_MIN; nr <= INSTR_MAX; nr++)
          leds[nr].classList.toggle("active", aktiveNummern.includes(nr))
      }


      // ═══════════════════════════════════════════════════════════════
      // MASK-TABELLE
      //
      // Für jede aktive InstrNo:
      //   1. Welche Msk0-Msk5 sind "1"?
      //   2. D12D11-Wert aus aktuelleBits berechnen: D12*2 + D11 → 0..3
      //   3. In DigitMaskData filtern: Mask === MskNr UND D12D11 === Wert
      //   4. S-Spalten anzeigen: "E" = aktiv (grün), sonst grau
      //   5. Keine aktive Maske → Zeile grau
      // ═══════════════════════════════════════════════════════════════

      function d12d11Berechnen() {
        // D12 = Index 0, D11 = Index 1 in aktuelleBits
        const d12 = parseInt(aktuelleBits[0]) || 0
        const d11 = parseInt(aktuelleBits[1]) || 0
        return d12 * 2 + d11   // 0, 1, 2 oder 3
      }

      function maskTabelleAktualisieren(aktiveNummern) {
        const tbody = document.getElementById("mask-tbody")
        tbody.innerHTML = ""

        const d12d11 = d12d11Berechnen()

        for (const nr of aktiveNummern) {

          // instrData-Eintrag für diese InstrNo
          const instr = instrData.find(r => parseInt(r["InstrNo"]) === nr)
          if (!instr) continue

          const instrName = instr["InstrName"] || ""

          // Aktive Masken ermitteln (Msk0-Msk5 === "1")
          const aktiveMasken = []
          for (let m = 0; m <= 5; m++) {
            if ((instr["Msk" + m] || "").trim() === "1")
              aktiveMasken.push(m)
          }

          // Keine aktive Maske → graue Zeile
          if (aktiveMasken.length === 0) {
            const tr = document.createElement("tr")
            tr.className = "instr-row kein-msk"
            tr.innerHTML =
              `<td class="col-instrno">${nr}</td>` +
              `<td class="col-name">${instrName}</td>` +
              `<td class="col-msk">—</td>` +
              S_SPALTEN.map(() => `<td class="s-leer">·</td>`).join("")
            tbody.appendChild(tr)
            continue
          }

          // Pro aktive Maske: passenden DigitMask-Eintrag suchen
          for (const maskNr of aktiveMasken) {

            // Suche: Mask === maskNr UND D12D11 === berechneter Wert
            const maskEintrag = DigitMaskData.find(
              d => d["Mask"] === maskNr && d["D12D11"] === d12d11
            )

            const tr = document.createElement("tr")
            tr.className = "instr-row"

            let zellen = `<td class="col-instrno">${nr}</td>`
            zellen    += `<td class="col-name">${instrName}</td>`
            zellen    += `<td class="col-msk">Msk${maskNr}</td>`

            // S-Spalten: "E" = aktiv (grün), null/leer = inaktiv
            for (const s of S_SPALTEN) {
              const wert = maskEintrag ? maskEintrag[s] : null
              zellen += wert === "E"
                ? `<td class="s-aktiv">E</td>`
                : `<td class="s-leer">·</td>`
            }

            tr.innerHTML = zellen
            tbody.appendChild(tr)
          }
        }
      }


      // ═══════════════════════════════════════════════════════════════
      // ALLE ANZEIGEN AKTUALISIEREN
      // Zentrale Funktion: wird nach jedem Bit-Klick und Zeilenklick aufgerufen
      // ═══════════════════════════════════════════════════════════════

      function allesAktualisieren() {
        const gefundeneNummern = bitsDekodieren(aktuelleBits.join(""))
        ledsAktualisieren(gefundeneNummern)
        diagrammAktualisieren(gefundeneNummern)
        maskTabelleAktualisieren(gefundeneNummern)

        const infoEl = document.getElementById("current-info")
        if (gefundeneNummern.length > 0)
          infoEl.textContent = "InstrNo: [" + gefundeneNummern.join(", ") + "]"
        else
          infoEl.textContent = "Bits: " + aktuelleBits.join("") + " — keine Übereinstimmung"
      }


      // ═══════════════════════════════════════════════════════════════
      // BIT-EDITOREN
      // ═══════════════════════════════════════════════════════════════

      let aktuelleBits = []

      function editorZeichnen(containerId, spalten) {
        const container = document.getElementById(containerId)
        container.innerHTML = ""

        for (const spalte of spalten) {
          const i = BIT_COLS.indexOf(spalte)

          const col = document.createElement("div")
          col.style.cssText = "display:flex; flex-direction:column; align-items:center; gap:2px;"

          const name = document.createElement("div")
          name.className = "bit-cell bit-label"
          name.textContent = spalte

          const cell = document.createElement("div")
          cell.className = "bit-cell"
          cell.dataset.val = aktuelleBits[i]
          cell.textContent = aktuelleBits[i]

          cell.addEventListener("click", () => {
            aktuelleBits[i] = aktuelleBits[i] === "1" ? "0" : "1"
            alleEditorenZeichnen()
            allesAktualisieren()
          })

          col.appendChild(name)
          col.appendChild(cell)
          container.appendChild(col)
        }
      }

      function alleEditorenZeichnen() {
        editorZeichnen("bit-cells",      BIT_COLS)
        editorZeichnen("bit-cells-src",  SRC_COLS)
        editorZeichnen("bit-cells-dest", DEST_COLS)
      }


      // ═══════════════════════════════════════════════════════════════
      // CODE-LISTING aufbauen
      // ═══════════════════════════════════════════════════════════════

      const codeList = document.getElementById("code-list")
      let ausgewaehlteZeile = null

      for (const [idx, zeile] of codeData.entries()) {
        const label = zeile["Label"] || zeile["label"] || ""
        const addr  = zeile["Addr"]  || zeile["addr"]  || ""
        const line  = zeile["Line"]  || zeile["line"]  || ""
        const bits  = zeile["bits"]  || zeile["Bits"]  || ""
        const reass = zeile["reass"] || zeile["Reass"] || zeile["reass2"] || ""

        const div = document.createElement("div")
        div.className = "code-row"
        div.innerHTML =
          `<span class="col-label">${label}</span>` +
          `<span class="col-addr">${addr}</span>`   +
          `<span>${line}</span>`                     +
          `<span class="col-bits">${bits}</span>`   +
          `<span class="col-reass">${reass}</span>`

        div.addEventListener("click", () => zeileSelektion(div, bits))
        codeList.appendChild(div)
      }

      function zeileSelektion(div, bits) {
        if (ausgewaehlteZeile) ausgewaehlteZeile.classList.remove("selected")
        div.classList.add("selected")
        ausgewaehlteZeile = div

        aktuelleBits = bits.split("")
        document.getElementById("bit-editor").style.display = "block"
        alleEditorenZeichnen()
        allesAktualisieren()
      }


      // ═══════════════════════════════════════════════════════════════
      // BIT-DEKODIERUNG
      // ═══════════════════════════════════════════════════════════════

      function bitsDekodieren(bits) {
        if (!bits || bits.length < 13) return []

        const gefunden = []

        for (const instr of instrData) {
          const nr = parseInt(instr["InstrNo"] || "")
          if (isNaN(nr) || nr < INSTR_MIN || nr > INSTR_MAX) continue

          let passt = true
          for (let i = 0; i < BIT_COLS.length; i++) {
            const erwartet = (instr[BIT_COLS[i]] || "").trim()
            if (erwartet === "") continue
            if (bits[i] !== erwartet) { passt = false; break }
          }

          if (passt) gefunden.push(nr)
        }

        return gefunden
      }


      // ═══════════════════════════════════════════════════════════════
      // MXGRAPH: Diagramm laden
      // ═══════════════════════════════════════════════════════════════

      const container = document.getElementById("container")
      const graph = new mxGraph(container)

      graph.convertValueToString = function(cell) {
        if (cell.value && typeof cell.value === "object" && cell.value.getAttribute)
          return cell.value.getAttribute("label") || ""
        return cell.value || ""
      }

      graph.setEnabled(false)
      graph.isCellFoldable = function() { return false }
      graph.setTooltips(false)
      graph.setPanning(true)
      graph.panningHandler.useLeftButtonForPanning = true
      graph.getView().setTranslate(0, 0)
      graph.getView().setScale(1)

      const xmlDoc = mxUtils.parseXml(diagramXml)
      const codec  = new mxCodec(xmlDoc)
      codec.decode(xmlDoc.documentElement, graph.getModel())


      // ═══════════════════════════════════════════════════════════════
      // INSTR-ZELLEN SAMMELN
      // ═══════════════════════════════════════════════════════════════

      const instrZellenMap = {}

      for (const zelle of Object.values(graph.getModel().cells)) {
        const val = zelle.value
        if (!val || typeof val !== "object" || !val.getAttribute) continue

        const instrAttr = val.getAttribute("instr")
        if (!instrAttr || instrAttr === "") continue

        for (const teil of instrAttr.split(",")) {
          const nr = parseInt(teil.trim())
          if (isNaN(nr)) continue
          if (!instrZellenMap[nr]) instrZellenMap[nr] = []
          instrZellenMap[nr].push(zelle)
        }
      }

      console.log("instr-Nummern im Diagramm:", Object.keys(instrZellenMap))


      // ═══════════════════════════════════════════════════════════════
      // DIAGRAMM AKTUALISIEREN
      // ═══════════════════════════════════════════════════════════════

      function zelleEinfaerben(zelle, farbe) {
        if (zelle.isEdge()) {
          graph.setCellStyles(mxConstants.STYLE_STROKECOLOR, farbe, [zelle])
        } else {
          graph.setCellStyles(mxConstants.STYLE_FILLCOLOR,   farbe, [zelle])
          graph.setCellStyles(mxConstants.STYLE_STROKECOLOR, farbe, [zelle])
        }
      }

      function diagrammAktualisieren(aktiveNummern) {
        const model = graph.getModel()
        model.beginUpdate()
        try {
          for (const zellen of Object.values(instrZellenMap))
            for (const zelle of zellen)
              zelleEinfaerben(zelle, FARBE_INAKTIV)

          for (const nr of aktiveNummern) {
            const zellen = instrZellenMap[nr]
            if (!zellen) continue
            for (const zelle of zellen)
              zelleEinfaerben(zelle, FARBE_AKTIV)
          }
        } finally {
          model.endUpdate()
        }
      }

    </script>
  </body>
</html>
