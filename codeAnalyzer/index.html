<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Code Analyse</title>
    <script src="code.js"></script>
    <script src="instr.js"></script>
    <script src="diagram.js"></script>
    <script src="digitMask.js"></script>
    <script src="classes.js"></script>
    <script>
      /// <reference path="./classes.js" />
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: monospace;
        font-size: 12px;
        background: #1e1e1e;
        color: #ccc;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* --- LED-Leiste --- */
      #led-bar {
        background: #111;
        border-bottom: 1px solid #333;
        padding: 6px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #led-bar span.led-label {
        color: #888;
        margin-right: 4px;
        font-size: 11px;
      }
      .led {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #333;
        border: 1px solid #555;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: #666;
        transition: background 0.2s, color 0.2s;
      }
      .led.active {
        background: #cc0000;
        border-color: #ff4444;
        color: #fff;
        box-shadow: 0 0 6px #cc0000;
      }

      /* --- Mask-Tabelle --- */
      #mask-panel {
        background: #161622;
        border-bottom: 2px solid #333;
        overflow-x: auto;
        overflow-y: auto;
        max-height: 160px;
        flex-shrink: 0;
      }
      #mask-panel table {
        border-collapse: collapse;
        white-space: nowrap;
        font-size: 11px;
      }
      #mask-panel th {
        background: #1e1e30;
        color: #888;
        padding: 3px 6px;
        border: 1px solid #333;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      #mask-panel td {
        padding: 2px 6px;
        border: 1px solid #2a2a2a;
      }
      #mask-panel tr.instr-row td          { background: #1a1a2e; color: #ccc; }
      #mask-panel tr.instr-row.kein-msk td { background: #222;    color: #555; }
      #mask-panel td.s-aktiv  { color: #4ec94e; font-weight: bold; }
      #mask-panel td.s-leer   { color: #2a2a2a; }
      #mask-panel td.col-instrno { color: #9cdcfe; text-align: right; }
      #mask-panel td.col-msk     { color: #ce9178; text-align: center; }
      #mask-panel td.col-name    { color: #4ec9b0; max-width: 200px;
                                   overflow: hidden; text-overflow: ellipsis; }

      /* --- Hauptbereich --- */
      #main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* --- Code-Listing --- */
      #code-panel {
        width: 700px;
        min-width: 450px;
        display: flex;
        flex-direction: column;
        border-right: 2px solid #333;
      }
      #code-header {
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 4px 8px;
        color: #aaa;
        font-size: 11px;
        display: grid;
        grid-template-columns: 50px 40px 40px 100px 1fr;
        gap: 4px;
      }
      #code-list {
        overflow-y: auto;
        flex: 1;
      }
      .code-row {
        display: grid;
        grid-template-columns: 50px 40px 40px 100px 1fr;
        gap: 4px;
        padding: 2px 8px;
        cursor: pointer;
        border-bottom: 1px solid #2a2a2a;
        line-height: 1.5;
      }
      .code-row:hover        { background: #2a2a2a; }
      .code-row.selected     { background: #1a3a5c; color: #fff; }
      .code-row .col-bits    { color: #569cd6; letter-spacing: 1px; }
      .code-row .col-addr    { color: #9cdcfe; }
      .code-row .col-label   { color: #4ec9b0; }
      .code-row .col-reass   { color: #ce9178; }

      /* --- Bit-Editor --- */
      .bit-cell {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
        font-size: 10px;
        cursor: pointer;
        border: 1px solid #444;
        user-select: none;
      }
      .bit-cell.bit-label {
        color: #666;
        font-size: 9px;
        cursor: default;
        border: none;
        background: transparent;
        height: auto;
      }
      .bit-cell[data-val="1"] { background: #1a4a1a; color: #4ec94e; border-color: #4ec94e; }
      .bit-cell[data-val="0"] { background: #2a2a2a; color: #888;    border-color: #444;    }

      /* --- Diagramm --- */
      @keyframes blinken {
        0%, 100% { opacity: 1;   }
        50%       { opacity: 0.2; }
      }
      #container1 [fill="#cc0000"]   { animation: blinken 1s infinite; }
      #container1 [stroke="#cc0000"] { animation: blinken 1s infinite; }
      #container2 [fill="#cc0000"]   { animation: blinken 1s infinite; }
      #container2 [stroke="#cc0000"] { animation: blinken 1s infinite; }

      #diagram-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #diagram-info {
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 4px 10px;
        color: #888;
        font-size: 11px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      #diagram-info #current-info { color: #4ec9b0; }
      #container1, #container2 {
        flex: 1;
        overflow: auto;
        background: #fff;
      }
      #container1 > div, #container2  > div {
        width: 1169px;
        height: 1654px;
      }
    </style>
  </head>
  <body>

    <!-- LED-Leiste: InstrNo 11–74 -->
    <div id="led-bar">
      <span class="led-label">InstrNo:</span>
    </div>



    <div id="main">

      <!-- Code-Listing links -->
      <div id="code-panel">
            <!-- Mask-Tabelle -->
        <div id="mask-panel">
          <table id="mask-table">
            <thead>
              <tr>
                <th>InstrNo</th>
                <th>InstrName</th>
                <th>Msk</th>
                <th>S7</th><th>S11</th><th>S5</th><th>S10</th><th>S13</th><th>S6</th><th>S3</th>
                <th>S9</th><th>S4</th><th>S2</th><th>S1</th><th>S8</th><th>S12</th><th>S14</th>
              </tr>
            </thead>
            <tbody id="mask-tbody"></tbody>
          </table>
        </div>
        <div id="code-header">
          <span>Label</span>
          <span>Addr</span>
          <span>Line</span>
          <span>Bits</span>
          <span>Reass</span>
        </div>

        <!-- Bit-Editoren: erscheinen nach erstem Zeilenklick -->
        <div id="bit-editor" style="background:#1a1a2e; border-bottom:1px solid #333;
                                    padding:4px 8px; display:none;">
          <div style="color:#888; font-size:10px; margin-bottom:3px;">Bits bearbeiten:</div>
          <div id="bit-cells" style="display:flex; gap:3px;"></div>
          <div style="display:flex; gap:16px; margin-top:4px;">
            <div>
              <div style="color:#888; font-size:10px; margin-bottom:3px;">src: (D7 D6 D1 D0)</div>
              <div id="bit-cells-src" style="display:flex; gap:3px;"></div>
            </div>
            <div>
              <div style="color:#888; font-size:10px; margin-bottom:3px;">dest: (D10 D9 D8)</div>
              <div id="bit-cells-dest" style="display:flex; gap:3px;"></div>
            </div>
          </div>
        </div>

        <div id="code-list"></div>
      </div>

      <!-- Diagramm rechts -->
      <div id="diagram-panel">
        <div id="diagram-info">
          <span>Klick auf Zeile → Decode</span>
          <button id="step-btn" onclick="stepAusfuehren()"
                  style="padding:2px 10px; background:#1a3a1a; color:#4ec94e;
                        border:1px solid #4ec94e; border-radius:3px; cursor:pointer;
                        font-family:monospace; font-size:11px;">
            ► Step
          </button>
          <span id="current-info"></span>
        </div>
        <div id="container1"></div>
        <div style="height:3px; background: linear-gradient(to right, #333, #666, #333); flex-shrink:0;"></div>
        <div id="container2"></div>
      </div>

    </div>

    <!-- Debug-Eingabe Dialog (versteckt) -->
    <div id="debug-overlay" style="display:none; position:fixed; top:0; left:0;
        width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000;
        align-items:center; justify-content:center;">
      <div style="background:#1a1a2e; border:1px solid #4ec94e; border-radius:6px;
                  padding:16px; min-width:300px;">
        <div id="debug-titel" style="color:#4ec9b0; font-size:13px; margin-bottom:10px;"></div>
        <div id="debug-anzeige" style="font-family:monospace; font-size:18px; letter-spacing:4px;
            background:#111; padding:8px 12px; border-radius:4px;
            border:1px solid #333; cursor:default; user-select:none;"></div>
        <div style="display:flex; gap:8px; margin-top:12px; justify-content:flex-end;">
          <button id="debug-ok" style="background:#1a3a1a; color:#4ec94e; border:1px solid #4ec94e;
                  border-radius:3px; padding:3px 12px; cursor:pointer; font-family:monospace;">
            OK
          </button>
          <button id="debug-abbrechen" style="background:#2a2a2a; color:#888; border:1px solid #555;
                  border-radius:3px; padding:3px 12px; cursor:pointer; font-family:monospace;">
            Abbrechen
          </button>
        </div>
      </div>
    </div>

    <script>
      window.mxBasePath = "https://cdn.jsdelivr.net/npm/mxgraph@4.2.2/javascript/src"
      window.mxLoadStylesheets = false
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mxgraph@4.2.2/javascript/mxClient.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
